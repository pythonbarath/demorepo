<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Page</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, #4f9cf9, transparent 35%),
          radial-gradient(circle at bottom right, #8b5cf6, transparent 30%),
          #0f172a;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        width: min(100%, 760px);
        padding: 2rem;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.16);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.35);
        backdrop-filter: blur(16px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.95rem;
        border-radius: 999px;
        background: rgba(79, 156, 249, 0.16);
        color: #dbeafe;
        font-size: 0.9rem;
        font-weight: 600;
      }

      h1 {
        margin: 1.2rem 0 0.5rem;
        font-size: clamp(2rem, 4vw, 3.5rem);
        letter-spacing: -0.04em;
        line-height: 1.05;
      }

      p {
        margin: 0.75rem 0 1.6rem;
        max-width: 42rem;
        color: #cbd5e1;
        line-height: 1.75;
        font-size: 1.05rem;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        padding: 0.95rem 1.35rem;
        border-radius: 999px;
        border: none;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .button.primary {
        color: #ffffff;
        background: linear-gradient(135deg, #4f9cf9, #8b5cf6);
        box-shadow: 0 18px 36px rgba(79, 156, 249, 0.26);
      }

      .button.secondary {
        color: #cbd5e1;
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.28);
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .footer {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        color: #94a3b8;
        font-size: 0.92rem;
      }

      .footer span {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">New Design</span>
      <h1>Welcome to your styled demo page.</h1>
      <p>
        This page now includes a modern layout, gradient background, glassmorphism card, and responsive buttons to give the project a polished look.
      </p>
      <div class="buttons">
        <button class="button primary">Get Started</button>
        <button class="button secondary">Learn More</button>
      </div>
      <div class="footer">
        <span>✨ Created with simple HTML and CSS</span>
        <span>📐 Responsive design for desktop and mobile</span>
      </div>
    </main>
  </body>
</html>
